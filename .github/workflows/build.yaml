name: Build

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RESTIC_IMAGE: restic/restic
  RESTIC_TAG: 0.19.0
  RESTIC_DIGEST: sha256:7f44e0057b82348597568ea209360762d0b38f8e1dbc8ad859661ac1055e45f2

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ vars.IMAGE_REPOSITORY }}
          tags: |
            type=raw,priority=1000,value=latest
            type=semver,pattern={{version}},value=${{ env.RESTIC_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RESTIC_TAG }}
            type=semver,pattern={{major}},value=${{ env.RESTIC_TAG }}
          labels: |
            maintainer=gabe565
            org.opencontainers.image.vendor=gabe565

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.ref_name == 'main' }}
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RESTIC_TAG=${{ env.RESTIC_TAG }}@${{ env.RESTIC_DIGEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
